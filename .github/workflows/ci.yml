name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  test:
    name: Build and test (no secrets)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Protocol headers in sync
        run: ./tools/check_protocol_sync.sh

      - name: Native protocol harness (ASan+UBSan, TSan)
        run: make test-native

      - name: DSP and host tests
        run: make test-host

      - name: App tests (locked dependencies)
        run: make test-app

      - name: Driver build
        run: |
          cmake -S packages/driver -B packages/driver/build -DCMAKE_BUILD_TYPE=Release
          cmake --build packages/driver/build --parallel
